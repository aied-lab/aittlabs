<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 帶來的職場革命與創新 | AI 人才科技實驗室</title>
<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #131829;
  --bg-tertiary: #1a2138;
  --bg-card: #1e2742;
  --bg-light: #f7f8fb;
  --bg-light-alt: #ffffff;
  --border-color: #2a3553;
  --border-light: #e5e7eb;
  --text-primary: #e8ecf5;
  --text-secondary: #9aa5c0;
  --text-muted: #6b7794;
  --text-dark: #1a1f36;
  --text-dark-2: #4b5563;
  --accent-purple: #8b5cf6;
  --accent-blue: #3b82f6;
  --accent-pink: #ec4899;
  --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
  --tag-foundation: #10b981;
  --tag-principle: #3b82f6;
  --tag-challenge: #f59e0b;
  --tag-practice: #ec4899;
  --tag-advanced: #8b5cf6;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-primary);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  line-height: 1.6;
}

/* ============ 密碼鎖 ============ */
.gate-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-primary);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.gate-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
  pointer-events: none;
}
.gate-card {
  position: relative;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 40px 36px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  text-align: center;
}
.gate-logo-img {
  width: 56px; height: 56px;
  border-radius: 14px;
  margin: 0 auto 20px;
  display: block;
  object-fit: contain;
}
.gate-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}
.gate-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 28px;
}
.gate-input-wrap {
  margin-bottom: 8px;
}
.gate-input {
  width: 100%;
  padding: 13px 16px;
  background: var(--bg-tertiary);
  border: 1.5px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: all 0.15s;
}
.gate-input:focus {
  border-color: var(--accent-purple);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
}
.gate-input.error {
  border-color: #ef4444;
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.gate-error-msg {
  color: #fca5a5;
  font-size: 13px;
  min-height: 18px;
  margin-bottom: 14px;
  text-align: left;
  padding-left: 4px;
}
.gate-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent-gradient);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.1s, box-shadow 0.15s;
}
.gate-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
}
.gate-btn:active { transform: translateY(0); }
.gate-divider {
  margin: 28px 0 16px;
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.gate-cta {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 2;
}
.gate-cta a {
  color: var(--accent-purple);
  text-decoration: none;
  font-weight: 600;
}
.gate-cta a:hover { color: #c4b5fd; }
.gate-footer {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 12px;
  color: var(--text-muted);
}
body.locked { overflow: hidden; }
body.locked .app-container { display: none; }

/* ============ Header ============ */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  height: 64px;
  flex-shrink: 0;
}
.header-inner {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 24px;
  gap: 16px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  align-items: center;
  justify-content: center;
}
.brand-logo-img {
  width: 38px; height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  object-fit: contain;
}
.brand-link {
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.brand-link:hover .brand-title { color: #c4b5fd; }
.brand-title {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  transition: color 0.15s;
}
.header-course-title {
  flex: 1;
  text-align: center;
  font-size: 19px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
  padding: 0 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.progress-container {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.progress-bar-wrap {
  width: 120px;
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: var(--accent-gradient);
  width: 0%;
  transition: width 0.4s;
}
.progress-text {
  font-size: 12px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

@media (max-width: 1200px) {
  .header-course-title { font-size: 16px; padding: 0 12px; }
}
@media (max-width: 768px) {
  .header-course-title { display: none; }
  .menu-toggle { display: inline-flex; }
  .header-inner { padding: 0 14px; }
  .progress-bar-wrap { width: 70px; }
}

/* ============ App Layout ============ */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ============ Sidebar ============ */
.sidebar {
  width: 320px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 18px 12px;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.sidebar-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}
.chapter-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px 0;
}
.chapter-item {
  display: flex;
  gap: 12px;
  padding: 12px 10px;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 8px;
  position: relative;
  transition: background 0.15s;
  border: 1px solid transparent;
}
.chapter-item:hover {
  background: var(--bg-tertiary);
}
.chapter-item.active {
  background: linear-gradient(90deg, rgba(139, 92, 246, 0.18) 0%, rgba(59, 130, 246, 0.06) 100%);
  border-color: rgba(139, 92, 246, 0.3);
}
.chapter-item.active::before {
  content: '';
  position: absolute;
  left: -12px;
  top: 12px;
  bottom: 12px;
  width: 3px;
  background: var(--accent-gradient);
  border-radius: 0 2px 2px 0;
}
.chapter-thumb {
  width: 110px;
  height: 62px;
  border-radius: 6px;
  object-fit: cover;
  background: var(--bg-tertiary);
  flex-shrink: 0;
}
.chapter-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chapter-tag {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.3px;
  align-self: flex-start;
  text-transform: uppercase;
}
.tag-foundation { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
.tag-principle { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
.tag-challenge { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
.tag-practice { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; }
.tag-advanced { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
.chapter-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.chapter-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
}
.chapter-done {
  color: #10b981;
  font-size: 12px;
}
.sidebar-footer {
  padding: 12px 16px 18px;
  border-top: 1px solid var(--border-color);
  margin-top: 8px;
}
.reset-btn {
  width: 100%;
  padding: 9px 12px;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.reset-btn:hover {
  border-color: #ef4444;
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.08);
}

/* ============ Main Content ============ */
.main-content {
  flex: 1;
  background: var(--bg-light);
  color: var(--text-dark);
  overflow-y: auto;
  padding: 36px 48px 80px;
}
.content-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.content-tag {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 5px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.content-number {
  font-size: 13px;
  color: var(--text-dark-2);
  font-weight: 500;
}
.content-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-dark);
  line-height: 1.3;
  margin: 0 0 14px;
  letter-spacing: -0.3px;
}
.content-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 24px;
  font-size: 14px;
  color: var(--text-dark-2);
}
.content-meta span { display: inline-flex; align-items: center; gap: 6px; }
.content-meta strong { color: var(--text-dark); font-weight: 600; }

/* YouTube 海報播放器 */
.video-poster {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  margin-bottom: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.video-poster img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
}
.video-poster:hover img { transform: scale(1.02); }
.video-poster iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.play-button {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
}
.play-icon {
  width: 80px;
  height: 80px;
  background: rgba(255, 0, 0, 0.92);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}
.video-poster:hover .play-icon { transform: scale(1.08); background: rgba(255, 0, 0, 1); }
.play-icon::after {
  content: '';
  width: 0;
  height: 0;
  border-left: 22px solid white;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  margin-left: 6px;
}
.video-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border-light);
  background: white;
  color: var(--text-dark);
  text-decoration: none;
  transition: all 0.15s;
  font-family: inherit;
}
.btn-action:hover {
  border-color: #d1d5db;
  background: #f9fafb;
  transform: translateY(-1px);
}
.btn-complete.done {
  background: #10b981;
  color: white;
  border-color: #10b981;
}

/* 內容區塊(左側彩色細條) */
.section-block {
  position: relative;
  padding: 4px 0 4px 22px;
  margin-bottom: 28px;
}
.section-block::before {
  content: '';
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  border-radius: 2px;
}
.section-intro::before { background: var(--accent-blue); }
.section-why::before { background: var(--accent-purple); }
.section-reflection::before { background: var(--accent-pink); }
.section-block h3 {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--text-dark);
}
.section-block p {
  font-size: 15.5px;
  color: var(--text-dark-2);
  line-height: 1.85;
  margin: 0;
}

/* 三題自我測驗 */
.quiz-section {
  background: white;
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 28px;
  margin: 32px 0;
}
.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.quiz-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-dark);
}
.quiz-reset {
  padding: 6px 12px;
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-dark-2);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.quiz-reset:hover { background: #f9fafb; border-color: #d1d5db; }
.quiz-subtitle {
  font-size: 13px;
  color: var(--text-dark-2);
  margin-bottom: 22px;
}
.quiz-question {
  margin-bottom: 24px;
}
.quiz-question:last-child { margin-bottom: 0; }
.quiz-q-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.quiz-level-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 4px;
  background: #f3f4f6;
  color: #4b5563;
  letter-spacing: 0.3px;
}
.quiz-q-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.55;
  margin-bottom: 14px;
}
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border: 1.5px solid var(--border-light);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14.5px;
  color: var(--text-dark);
  background: white;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  line-height: 1.6;
}
.quiz-option:hover:not(:disabled) {
  border-color: var(--accent-purple);
  background: #faf5ff;
}
.quiz-option:disabled { cursor: default; }
.quiz-option.correct {
  border-color: #10b981;
  background: #f0fdf4;
  color: #065f46;
}
.quiz-option.wrong {
  border-color: #ef4444;
  background: #fef2f2;
  color: #991b1b;
}
.quiz-option.dim { opacity: 0.45; }
.quiz-letter {
  font-weight: 700;
  font-size: 13px;
  width: 22px;
  flex-shrink: 0;
  color: var(--text-dark-2);
  margin-top: 1px;
}
.quiz-option.correct .quiz-letter { color: #065f46; }
.quiz-option.wrong .quiz-letter { color: #991b1b; }
.quiz-feedback {
  margin-top: 12px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.7;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct {
  background: #ecfdf5;
  border-left: 3px solid #10b981;
  color: #065f46;
}
.quiz-feedback.wrong {
  background: #fef2f2;
  border-left: 3px solid #ef4444;
  color: #7f1d1d;
}
.quiz-feedback strong { display: block; margin-bottom: 6px; font-weight: 700; }
.quiz-feedback .biz {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed rgba(0,0,0,0.12);
  font-size: 13.5px;
}
.quiz-feedback .biz strong { color: inherit; }

/* 章節導航 */
.nav-pager {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border-light);
}
.pager-btn {
  flex: 1;
  max-width: 280px;
  padding: 14px 18px;
  border: 1px solid var(--border-light);
  background: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pager-btn:hover:not(:disabled) {
  border-color: var(--accent-purple);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}
.pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pager-btn.next { text-align: right; }
.pager-direction {
  font-size: 11px;
  color: var(--text-dark-2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.pager-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.4;
}

/* 學習路徑邏輯總覽 */
.learning-path {
  margin-top: 56px;
  padding: 28px;
  background: white;
  border: 1px solid var(--border-light);
  border-radius: 12px;
}
.learning-path-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.path-flow {
  display: flex;
  align-items: stretch;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.path-step {
  flex: 1;
  min-width: 120px;
  padding: 12px;
  background: var(--bg-light);
  border-radius: 8px;
  text-align: center;
  position: relative;
}
.path-arrow {
  display: flex;
  align-items: center;
  color: var(--text-dark-2);
  font-size: 20px;
  padding: 0 4px;
}
.path-step-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dark-2);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}
.path-step-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 4px;
}
.path-step-role {
  font-size: 11px;
  color: var(--text-dark-2);
}
.path-summary {
  font-size: 14px;
  color: var(--text-dark-2);
  line-height: 1.75;

const CHAPTERS = [{"id": "ch1", "video_id": "sal78ACtGTc", "stage": "foundation", "stage_label": "🌱 入門", "number": "01", "title": "What's Next for AI Agentic Workflows", "creator": "Andrew Ng", "creator_role": "DeepLearning.AI / AI Fund 創辦人", "venue": "Sequoia Capital AI Ascent", "year": "2024", "duration": "14 分鐘", "language": "英文", "intro": "Andrew Ng 在 Sequoia 旗艦級 AI 大會 AI Ascent 的關鍵演講,首次系統性地提出「Agentic Workflow」這個正在改寫 AI 產業遊戲規則的概念。他用一個強烈的反差數據揭露真相:GPT-3 套上 agentic workflow 的表現,竟然超越了還沒採用此模式的 GPT-4。隨後他拆解四大設計模式——Reflection(反思)、Tool Use(工具使用)、Planning(規劃)、Multi-agent Collaboration(多代理協作)——並預言這將是 2024-2026 年最重要的 AI 進化路徑。", "why": "這是「AI Agent」這個詞從研究圈擴散到產業圈的引爆點演講。Andrew Ng 用 14 分鐘把所有後續產業話題的根都種下,任何想理解「為什麼 2025 之後突然到處都在講 Agent」的人,這是必看的「源頭文獻」級內容。", "reflection": "您所處的工作流程中,有哪些任務可能因為從「one-shot prompt」轉為「iterative agentic workflow」而被根本性改寫?", "youtube_url": "https://www.youtube.com/watch?v=sal78ACtGTc", "quiz": [{"level": "記憶", "level_emoji": "🧠", "question": "Andrew Ng 在演講中提出 AI agentic workflow 的四大設計模式,以下哪一項「不」屬於這四種?", "options": ["Fine-tuning(模型微調)", "Tool Use(工具使用)", "Reflection(反思)", "Multi-agent Collaboration(多代理協作)"], "correct": 0, "explanation": "Andrew Ng 提出的四大設計模式為:Reflection、Tool Use、Planning、Multi-agent Collaboration。Fine-tuning 是模型訓練技術,並非 agentic workflow 的設計模式。", "biz": "您在規劃 AI 應用時,應優先思考工作流程設計(這四大模式)而非急著訓練自家模型。先用 agentic workflow 把現有 LLM 的潛力榨乾,通常 ROI 比微調模型高得多。"}, {"level": "觀點", "level_emoji": "🎯", "question": "Andrew Ng 用 GPT-3 加 agentic workflow 對比 GPT-4 的數據,主要想傳達什麼核心觀點?", "options": ["GPT-3 比 GPT-4 更值得使用,因為更便宜", "Agentic workflow 只能讓舊模型勉強追上新模型", "工作流程設計帶來的提升,可能勝過底層模型升級", "應該等 GPT-5 出來再考慮 agentic workflow"], "correct": 2, "explanation": "Andrew Ng 的核心訊息是:agentic workflow 讓「如何用模型」變得比「用哪個模型」更重要。這顛覆了「只要等更強的模型就好」的被動思維。", "biz": "對您的組織而言,這意味著「等待更強模型才動手」是錯誤策略。現在就用現有模型 + agentic workflow 重新設計工作流程,反而能比競爭對手早一步建立組織能力(這個能力本身就是護城河)。"}, {"level": "應用", "level_emoji": "💡", "question": "假設您是某顧問公司的合夥人,團隊每週要產出大量「市場研究報告」。應用 Andrew Ng 提出的 agentic workflow 思維,以下哪個切入點最能立即產生 ROI?", "options": ["叫顧問改用 GPT-4 而非 GPT-3.5", "等 OpenAI 推出更強模型再說", "禁止顧問用 AI,確保品質", "設計一個多 agent 協作流程:研究員 agent + 編輯 agent + 反思 agent 互相迭代產出報告"], "correct": 3, "explanation": "Multi-agent collaboration + Reflection 模式正是 Andrew Ng 演講中強調對「結構化產出工作」最有效的組合。一個 agent 寫初稿、另一個 agent 批判、再一個 agent 改稿,品質遠勝單一 prompt。", "biz": "您可在 1-2 週內用 n8n、LangChain、或 CrewAI 等工具搭出原型,先用一個服務線(例如競品分析報告)驗證效益。重點不是「換更強的 AI」,而是「重新設計工作流程」。內部能複製這套流程的顧問,生產力會在 3 個月內顯著拉開差距。"}]}, {"id": "ch2", "video_id": "M2Yg1kwPpts", "stage": "principle", "stage_label": "🔬 技術", "number": "02", "title": "一堂課搞懂 AI Agent 的原理", "creator": "李宏毅", "creator_role": "台灣大學電機系教授", "venue": "2025 生成式 AI 時代下的機器學習", "year": "2025", "duration": "60 分鐘", "language": "中文", "intro": "台大資工最受歡迎的 AI 教授李宏毅,用一堂課完整講透 AI Agent 的內部運作原理。從「人類給予目標,AI 自己想辦法達成」這個本質定義出發,系統性拆解三大核心能力:透過經驗調整行為(從 RL 到 LLM 記憶)、使用工具(Function Calling 的真正意義)、做計劃(從 AlphaZero 到 LLM Planning)。整堂課用大量視覺化投影片,讓沒有 ML 背景的人也能理解 Agent 為什麼「不只是 ChatGPT 加外掛」。", "why": "這是華語圈罕見的「學術深度 + 教學品質」雙高的 Agent 原理課程,且完全免費。對於想跨越「我會用 ChatGPT」到「我懂 Agent 為什麼能做更多事」鴻溝的人,李宏毅的講解風格能讓技術門檻自然降低,卻不犧牲嚴謹度。", "reflection": "李宏毅指出 Agent 的核心是「目標導向」而非「指令導向」——這個差別對您要不要重新設計團隊的工作分派方式,有什麼啟示?", "youtube_url": "https://www.youtube.com/watch?v=M2Yg1kwPpts", "quiz": [{"level": "記憶", "level_emoji": "🧠", "question": "李宏毅老師對 AI Agent 的定義中,最關鍵的一句話是?", "options": ["人類給予指令,AI 一步步執行", "人類與 AI 一起完成每個步驟", "AI 自己設定目標,自己達成", "人類給予目標,AI 自己想辦法達成"], "correct": 3, "explanation": "李宏毅強調 Agent 的本質定義是「人類給予目標,AI 自己想辦法達成」,這也是 Agent 與一般 ChatGPT 對話最關鍵的差別:從「step-by-step 指令」轉為「goal-oriented 委派」。", "biz": "這個定義對您的工作分派思維有根本性影響:過去您可能習慣「列出每一步」交給工具去做,Agent 時代的核心能力反而是「清楚定義目標」+「設定邊界與成功標準」。後者反而更接近高階主管的工作方式。"}, {"level": "觀點", "level_emoji": "🎯", "question": "李宏毅在課程中強調 Agent 與「傳統自動化工具」最關鍵的差異在於?", "options": ["Agent 跑得比傳統自動化快", "Agent 能在執行過程中靈活調整計畫", "Agent 用了更新版本的程式語言", "Agent 不需要連網"], "correct": 1, "explanation": "傳統自動化(如 RPA、巨集)是「按預設腳本一條路走到底」,Agent 的革命性差異是能根據中途發生的狀況「靈活調整計畫」,這也是它能處理複雜目標的根本原因。", "biz": "對您而言,這意味著:過去無法用 RPA 自動化的「需要判斷力的工作」,在 Agent 時代有機會被自動化。例如客戶投訴處理、 // ===== 密碼鎖 =====
async function sha256(text) {
  const buffer = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlockPage() {
  document.body.classList.remove('locked');
  const overlay = document.getElementById('gateOverlay');
  if (overlay) overlay.style.display = 'none';
  try { sessionStorage.setItem('aitt_unlocked_2026_05', '1'); } catch (e) {}
  init();
}

(function initGate() {
  try {
    if (sessionStorage.getItem('aitt_unlocked_2026_05') === '1') {
      unlockPage();
      return;
    }
  } catch (e) {}
  const form = document.getElementById('gateForm');
  if (!form) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('gateInput').value.trim();
    if (!input) return;
    const hash = await sha256(input);
    if (hash === PASSWORD_HASH) {
      unlockPage();
    } else {
      const errEl = document.getElementById('gateError');
      const inputEl = document.getElementById('gateInput');
      errEl.textContent = '密碼錯誤,請確認後再試一次';
      inputEl.classList.add('error');
      inputEl.value = '';
      setTimeout(() => inputEl.classList.remove('error'), 500);
    }
  });
})();

// ===== State =====
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { current: 0, completed: [], quizAnswers: {} };
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();
if (!state.quizAnswers) state.quizAnswers = {};

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderSidebar() {
  const list = document.getElementById('chapterList');
  list.innerHTML = CHAPTERS.map((ch, idx) => {
    const isActive = idx === state.current ? 'active' : '';
    const isDone = state.completed.includes(idx);
    return `
      <div class="chapter-item ${isActive}" data-idx="${idx}">
        <img class="chapter-thumb"
             src="https://img.youtube.com/vi/${ch.video_id}/mqdefault.jpg"
             onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${ch.video_id}/hqdefault.jpg';"

          <span class="chapter-tag tag-${ch.stage}">${ch.stage_label}</span>
          <div class="chapter-title">${escapeHtml(ch.title)}</div>
          <div class="chapter-info">
            <span>${escapeHtml(ch.duration)}</span>
            ${isDone ? '<span class="chapter-done">✓ 已完成</span>' : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.chapter-item').forEach(item => {
    item.addEventListener('click', () => {
      state.current = parseInt(item.dataset.idx);
      saveState(state);
      renderAll();
      document.getElementById('mainContent').scrollTop = 0;
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
      }
    });
  });
}

  const completedCount = state.completed.length;
  const total = CHAPTERS.length;
  const pct = (completedCount / total) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${completedCount}/${total} 已完成`;

  // Quiz progress
  let correctCount = 0;
  let totalQuiz = 0;
  CHAPTERS.forEach((ch, chIdx) => {
    ch.quiz.forEach((q, qIdx) => {

  document.getElementById('quizProgressText').textContent = `📝 ${correctCount}/${totalQuiz}`;

    if (answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === userAnswer) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" ${answered ? 'disabled' : ''} data-ch="${chIdx}" data-q="${qIdx}" data-i="${i}">
      <span class="quiz-letter">${letters[i]}.</span>
      <span>${escapeHtml(opt)}</span>
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if (answered) {
    const fbClass = isCorrect ? 'correct' : 'wrong';
    const fbHeader = isCorrect
      ? '✅ 答對了!'
      : `❌ 答錯了。正確答案是 ${letters[q.correct]}:${escapeHtml(q.options[q.correct])}`;
    feedbackHtml = `
      <div class="quiz-feedback show ${fbClass}">
        <strong>${fbHeader}</strong>
        ${escapeHtml(q.explanation)}
        <div class="biz"><strong>💼 企業含意:</strong>${escapeHtml(q.biz)}</div>
      </div>
    `;
  }

  return `
    <div class="quiz-question" data-q-idx="${qIdx}">
      <div class="quiz-q-header">
        <span class="quiz-level-badge">${q.level_emoji} Lv.${qIdx+1} ${escapeHtml(q.level)}</span>
      </div>
      <div class="quiz-q-text">${escapeHtml(q.question)}</div>
      <div class="quiz-options">${optionsHtml}</div>
      ${feedbackHtml}
    </div>
  `;
}

function renderMainContent() {
  const ch = CHAPTERS[state.current];
  const main = document.getElementById('mainContent');
  const isCompleted = state.completed.includes(state.current);
  const prevIdx = state.current - 1;
  const nextIdx = state.current + 1;

  const quizHtml = ch.quiz.map((q, qIdx) => renderQuizQuestion(state.current, qIdx, q)).join('');

  main.innerHTML = `
    <div class="content-header">
      <span class="content-tag tag-${ch.stage}">${ch.stage_label}</span>
      <span class="content-number">第 ${ch.number} 課 / 共 05 課</span>
    </div>
    <h1 class="content-title">${escapeHtml(ch.title)}</h1>
    <div class="content-meta">
      <span>👤 <strong>${escapeHtml(ch.creator)}</strong>(${escapeHtml(ch.creator_role)})</span>
      <span>📍 ${escapeHtml(ch.venue)}</span>
      <span>📅 ${escapeHtml(ch.year)}</span>
      <span>⏱️ ${escapeHtml(ch.duration)}</span>
      <span>🌐 ${escapeHtml(ch.language)}</span>
    </div>

    <div class="video-poster" id="videoPoster">
      <img src="https://img.youtube.com/vi/${ch.video_id}/maxresdefault.jpg"
           onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${ch.video_id}/hqdefault.jpg';"
           alt="${escapeHtml(ch.title)}">
      <div class="play-button"><div class="play-icon"></div></div>
    </div>

    <div class="video-actions">
      <a class="btn-action" href="${ch.youtube_url}" target="_blank" rel="noopener">▶️ 在 YouTube 開啟</a>
      <button class="btn-action btn-complete ${isCompleted ? 'done' : ''}" id="completeBtn">
        ${isCompleted ? '✓ 已標記完成' : '✓ 標記完成'}
      </button>
    </div>

    <div class="section-block section-intro">
      <h3>📖 簡介</h3>
      <p>${escapeHtml(ch.intro)}</p>
    </div>

    <div class="section-block section-why">
      <h3>💎 為什麼推薦</h3>
      <p>${escapeHtml(ch.why)}</p>
    </div>

    <div class="section-block section-reflection">
      <h3>🤔 學習反思</h3>
      <p>${escapeHtml(ch.reflection)}</p>
    </div>

    <div class="quiz-section">
      <div class="quiz-header">
        <div class="quiz-title">📝 三題自我測驗</div>
        <button class="quiz-reset" id="quizResetBtn">🔄 重新作答</button>
      </div>
      <div class="quiz-subtitle">記憶 → 觀點 → 應用,三層遞進確認學習成效</div>
      ${quizHtml}
    </div>

    <div class="nav-pager">
      <button class="pager-btn" ${prevIdx < 0 ? 'disabled' : ''} data-go="${prevIdx}">
        <span class="pager-direction">← 上一課</span>
        <span class="pager-title">${prevIdx >= 0 ? escapeHtml(CHAPTERS[prevIdx].title) : '已是第一課'}</span>
      </button>
      <button class="pager-btn next" ${nextIdx >= CHAPTERS.length ? 'disabled' : ''} data-go="${nextIdx}">
        <span class="pager-direction">下一課 →</span>
        <span class="pager-title">${nextIdx < CHAPTERS.length ? escapeHtml(CHAPTERS[nextIdx].title) : '已是最後一課'}</span>
      </button>
    </div>

    <div class="learning-path">
      <div class="learning-path-title">🧭 學習路徑邏輯總覽</div>
      <div class="path-flow">
        <div class="path-step"><div class="path-step-num">01</div><div class="path-step-name">Andrew Ng</div><div class="path-step-role">框架</div></div>
        <div class="path-arrow">→</div>
        <div class="path-step"><div class="path-step-num">02</div><div class="path-step-name">李宏毅</div><div class="path-step-role">原理</div></div>
        <div class="path-arrow">→</div>
        <div class="path-step"><div class="path-step-num">03</div><div class="path-step-name">Mollick</div><div class="path-step-role">組織衝擊</div></div>
        <div class="path-arrow">→</div>
        <div class="path-step"><div class="path-step-num">04</div><div class="path-step-name">Nadella</div><div class="path-step-role">實作決策</div></div>
        <div class="path-arrow">→</div>
        <div class="path-step"><div class="path-step-num">05</div><div class="path-step-name">Aravind</div><div class="path-step-role">未來職能</div></div>
      </div>
      <div class="path-summary">
        本期策展刻意涵蓋三層視角:<strong>Why</strong>(為什麼這次不一樣)由 Andrew Ng 與 Aravind 提供;<strong>How</strong>(如何運作)由李宏毅與 Nadella 拆解;<strong>So What</strong>(對我與組織的衝擊)貫穿 Mollick 與全篇反思題。建議按順序學習,但若您是 C-level,可優先看 03 → 04 → 05。
      </div>
    </div>

    <div class="content-footer">
      Learning Curator : <a href="https://aittlabs.org" target="_blank" rel="noopener">https://aittlabs.org</a>
    </div>
  `;

  // Bind events
  document.getElementById('videoPoster').addEventListener('click', function() {
    this.innerHTML = `<iframe src="https://www.youtube.com/embed/${ch.video_id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  });

  document.getElementById('completeBtn').addEventListener('click', function() {
    const idx = state.current;
    if (state.completed.includes(idx)) {
      state.completed = state.completed.filter(i => i !== idx);
    } else {
      state.completed.push(idx);
    }
    saveState(state);
    renderAll();
  });

  document.getElementById('quizResetBtn').addEventListener('click', function() {
    if (confirm('確定要重新作答本課所有測驗題嗎?')) {
      ch.quiz.forEach((q, qIdx) => {
        delete state.quizAnswers[`${state.current}_${qIdx}`];
      });
      saveState(state);
      renderAll();
    }
  });

  document.querySelectorAll('.pager-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.disabled) return;
      const goIdx = parseInt(this.dataset.go);
      if (!isNaN(goIdx) && goIdx >= 0 && goIdx < CHAPTERS.length) {
        state.current = goIdx;
        saveState(state);
        renderAll();
        document.getElementById('mainContent').scrollTop = 0;
      }
    });
  });

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.disabled) return;
      const chIdx = parseInt(this.dataset.ch);
      const qIdx = parseInt(this.dataset.q);
      const optI = parseInt(this.dataset.i);
      const key = `${chIdx}_${qIdx}`;
      if (state.quizAnswers[key] !== undefined) return;
      state.quizAnswers[key] = optI;
      saveState(state);
      renderAll();
    });
  });
}

function renderAll() {
  renderSidebar();
  renderMainContent();
  renderProgress();
}

function init() {
  if (!CHAPTERS || CHAPTERS.length === 0) return;
  if (state.current >= CHAPTERS.length) state.current = 0;
  renderAll();

  // Mobile menu
  const menuToggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  if (menuToggle && sidebar) {
    menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
  }

  // Reset
  document.getElementById('resetBtn').addEventListener('click', function() {
    if (confirm('確定要重置所有學習進度嗎?\n\n這會清除:\n• 章節完成記錄\n• 所有測驗答題\n• 章節停留位置\n\n重置後將回到第 1 章從頭開始。')) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      location.reload();
    }
  });
}

// 若已經解鎖,直接初始化
try {
  if (sessionStorage.getItem('aitt_unlocked_2026_05') === '1') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }
} catch (e) {}
</script>
</body>
</html>
