<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中國大陸 AI 發展現況與預測 | AI 人才科技實驗室</title>
<style>
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #131829;
  --bg-tertiary: #1a2138;
  --bg-card: #1e2742;
  --border-color: #2a3553;
  --text-primary: #e8ecf5;
  --text-secondary: #9aa5c0;
  --text-muted: #6b7794;
  --accent-purple: #8b5cf6;
  --accent-blue: #3b82f6;
  --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
  --accent-pink: #ec4899;
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
  --tag-foundation: #10b981;
  --tag-principle: #3b82f6;
  --tag-challenge: #f59e0b;
  --tag-practice: #ec4899;
  --tag-advanced: #8b5cf6;

  --light-bg: #f7f8fb;
  --light-card: #ffffff;
  --light-border: #e5e7ee;
  --light-text: #1a1f36;
  --light-text-secondary: #4a5168;
  --light-text-muted: #6b7794;

  --intro-accent: #3b82f6;
  --why-accent: #8b5cf6;
  --reflection-accent: #ec4899;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-primary);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  line-height: 1.6;
}

/* ===== Layout ===== */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== Header ===== */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
  z-index: 100;
}
.header-inner {
  display: flex;
  align-items: center;
  padding: 14px 24px;
  gap: 16px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.brand-logo-img {
  width: 38px; height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  object-fit: contain;
}
.brand-link {
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.brand-link:hover .brand-title { color: #c4b5fd; }
.brand-title {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  transition: color 0.15s;
}

.header-course-title {
  flex: 1;
  text-align: center;
  font-size: 19px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
  padding: 0 20px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress-container {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.progress-bar-wrap {
  width: 140px;
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent-gradient);
  transition: width 0.3s;
}
.progress-text {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
  white-space: nowrap;
}

@media (max-width: 1200px) {
  .header-course-title { font-size: 16px; padding: 0 12px; }
}
@media (max-width: 768px) {
  .header-course-title { display: none; }
  .menu-toggle { display: inline-flex; }
  .progress-bar-wrap { width: 80px; }
}

/* ===== Body Layout ===== */
.body-layout {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 320px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.sidebar-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.chapter-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.chapter-list::-webkit-scrollbar { width: 6px; }
.chapter-list::-webkit-scrollbar-track { background: transparent; }
.chapter-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

.chapter-item {
  display: flex;
  gap: 12px;
  padding: 12px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  position: relative;
}
.chapter-item:hover {
  background: rgba(139, 92, 246, 0.06);
}
.chapter-item.active {
  background: linear-gradient(90deg, rgba(139, 92, 246, 0.12) 0%, transparent 100%);
  border-left-color: var(--accent-purple);
}
.chapter-thumb {
  width: 110px;
  height: 62px;
  border-radius: 6px;
  background: var(--bg-tertiary);
  flex-shrink: 0;
  background-size: cover;
  background-position: center;
  position: relative;
  overflow: hidden;
}
.chapter-thumb::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.35) 100%);
  pointer-events: none;
}
.chapter-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chapter-stage {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.stage-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.stage-dot.foundation { background: var(--tag-foundation); }
.stage-dot.principle { background: var(--tag-principle); }
.stage-dot.challenge { background: var(--tag-challenge); }
.stage-dot.practice { background: var(--tag-practice); }
.stage-dot.advanced { background: var(--tag-advanced); }
.chapter-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.chapter-meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
}
.chapter-checkmark {
  font-size: 13px;
  color: #10b981;
}

.sidebar-footer {
  padding: 12px 16px 18px;
  border-top: 1px solid var(--border-color);
  margin-top: 8px;
}
.reset-btn {
  width: 100%;
  padding: 9px 12px;
  background: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.reset-btn:hover {
  border-color: #ef4444;
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.08);
}

@media (max-width: 1024px) {
  .sidebar { width: 280px; }
}
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.25s;
    width: 90vw;
    max-width: 340px;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
  }
  .sidebar-overlay.show { display: block; }
}

/* ===== Main Content ===== */
.main-content {
  flex: 1;
  background: var(--light-bg);
  color: var(--light-text);
  overflow-y: auto;
  padding: 36px 48px 60px;
}
.main-content::-webkit-scrollbar { width: 8px; }
.main-content::-webkit-scrollbar-track { background: transparent; }
.main-content::-webkit-scrollbar-thumb { background: #cbd0dc; border-radius: 4px; }

@media (max-width: 768px) {
  .main-content { padding: 24px 18px 60px; }
}

.content-inner {
  max-width: 880px;
  margin: 0 auto;
}

/* Stage tag (top) */
.content-stage-row {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
  letter-spacing: 0.3px;
}
.stage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.stage-pill.foundation { background: rgba(16, 185, 129, 0.12); color: #047857; }
.stage-pill.principle  { background: rgba(59, 130, 246, 0.12); color: #1e40af; }
.stage-pill.challenge  { background: rgba(245, 158, 11, 0.14); color: #b45309; }
.stage-pill.practice   { background: rgba(236, 72, 153, 0.12); color: #be185d; }
.stage-pill.advanced   { background: rgba(139, 92, 246, 0.14); color: #6d28d9; }
.chapter-num {
  font-size: 13px;
  color: var(--light-text-muted);
  font-weight: 500;
}

/* Chapter title */
.content-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--light-text);
  line-height: 1.3;
  margin: 0 0 14px;
}

/* Meta row */
.content-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 13.5px;
  color: var(--light-text-secondary);
  margin-bottom: 28px;
}
.content-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* Player */
.video-poster {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  cursor: pointer;
  margin-bottom: 18px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.18);
}
.video-poster iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-poster .poster-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.video-poster .play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.94);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,0.4);
}
.video-poster:hover .play-button {
  transform: translate(-50%, -50%) scale(1.06);
  background: #fff;
}
.video-poster .play-button::after {
  content: '';
  width: 0;
  height: 0;
  border-left: 22px solid #1a1f36;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  margin-left: 6px;
}

/* Action buttons */
.action-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 36px;
}
.btn {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  text-decoration: none;
}
.btn-primary {
  background: var(--light-text);
  color: white;
  border-color: var(--light-text);
}
.btn-primary:hover { background: #2c3147; }
.btn-secondary {
  background: white;
  color: var(--light-text);
  border-color: #d1d5dd;
}
.btn-secondary:hover { border-color: var(--light-text); }
.btn-success {
  background: #10b981;
  color: white;
  border-color: #10b981;
}

/* Section: intro / why / reflection (left bar style) */
.section-block {
  border-left: 4px solid var(--intro-accent);
  padding: 4px 0 4px 20px;
  margin-bottom: 32px;
}
.section-block.why { border-color: var(--why-accent); }
.section-block.reflection { border-color: var(--reflection-accent); }
.section-block h3 {
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--light-text);
}
.section-block p {
  font-size: 15.5px;
  line-height: 1.85;
  color: var(--light-text-secondary);
  margin: 0;
}
.section-block ul {
  margin: 0;
  padding-left: 20px;
  color: var(--light-text-secondary);
  font-size: 15.5px;
  line-height: 1.85;
}
.section-block li { margin-bottom: 6px; }

/* Quiz card */
.quiz-section {
  margin-bottom: 36px;
}
.quiz-section-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--light-text);
  margin-bottom: 4px;
}
.quiz-section-sub {
  font-size: 13.5px;
  color: var(--light-text-muted);
  margin-bottom: 18px;
}
.quiz-card {
  background: var(--light-card);
  border: 1px solid var(--light-border);
  border-radius: 10px;
  padding: 22px 24px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.quiz-level-badge {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.quiz-level-記憶 { background: #dcfce7; color: #166534; }
.quiz-level-觀點 { background: #dbeafe; color: #1e40af; }
.quiz-level-應用 { background: #fce7f3; color: #9d174d; }
.quiz-question {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--light-text);
  line-height: 1.55;
  margin-bottom: 14px;
}
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.quiz-option {
  text-align: left;
  font-family: inherit;
  font-size: 14.5px;
  padding: 11px 16px;
  background: #f7f8fb;
  border: 1.5px solid #e5e7ee;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
  color: var(--light-text-secondary);
  line-height: 1.5;
}
.quiz-option:hover:not(:disabled) {
  border-color: var(--accent-purple);
  background: white;
  color: var(--light-text);
}
.quiz-option:disabled {
  cursor: default;
}
.quiz-option.correct {
  background: #d1fae5;
  border-color: #10b981;
  color: #065f46;
}
.quiz-option.correct::after {
  content: ' ✓';
  font-weight: 700;
}
.quiz-option.wrong {
  background: #fee2e2;
  border-color: #ef4444;
  color: #991b1b;
}
.quiz-option.wrong::after {
  content: ' ✗';
  font-weight: 700;
}
.quiz-option.reveal {
  background: #ecfdf5;
  border-color: #6ee7b7;
  color: #065f46;
}
.quiz-feedback {
  margin-top: 14px;
  padding: 14px 16px;
  background: #f7f8fb;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--light-text-secondary);
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback strong { color: var(--light-text); }
.quiz-feedback .biz-tip {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #d1d5dd;
}
.quiz-retry {
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--accent-purple);
  background: transparent;
  border: 1px solid var(--accent-purple);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-family: inherit;
  display: none;
}
.quiz-retry.show { display: inline-block; }

/* Navigation row */
.nav-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 32px 0 24px;
}
.nav-btn {
  flex: 1;
  text-align: left;
  background: white;
  border: 1px solid var(--light-border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  max-width: 48%;
}
.nav-btn:hover:not(:disabled) {
  border-color: var(--accent-purple);
  transform: translateY(-1px);
}
.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.nav-btn .nav-label {
  font-size: 11px;
  color: var(--light-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 3px;
}
.nav-btn .nav-title {
  font-size: 14px;
  color: var(--light-text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-btn.next { text-align: right; }

/* Path overview */
.path-overview {
  background: white;
  border: 1px solid var(--light-border);
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 28px;
}
.path-overview h3 {
  font-size: 16px;
  margin: 0 0 10px;
  color: var(--light-text);
}
.path-overview pre {
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 13px;
  color: var(--light-text-secondary);
  background: #f7f8fb;
  padding: 14px;
  border-radius: 8px;
  margin: 0;
  white-space: pre-wrap;
  line-height: 1.7;
}

/* Footer */
.curator-footer {
  text-align: center;
  font-size: 13px;
  color: var(--light-text-muted);
  padding: 24px 0 0;
  border-top: 1px solid var(--light-border);
  margin-top: 28px;
}
.curator-footer a {
  color: var(--light-text-muted);
  text-decoration: none;
  border-bottom: 1px dotted #b8bdc9;
}
.curator-footer a:hover { color: var(--accent-purple); border-color: var(--accent-purple); }
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <button class="menu-toggle" id="menuToggle" aria-label="開啟選單">☰</button>
        <a href="https://aittlabs.org" target="_blank" rel="noopener" class="brand-link">
          <img class="brand-logo-img" alt="AITT.Labs" />
          <div class="brand-title">AI 人才科技實驗室</div>
        </a>
      </div>

      <div class="header-course-title" id="headerCourseTitle">中國大陸 AI 發展現況與預測</div>

      <div class="progress-container">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="progress-text" id="progressText">0/5 已完成</span>
        <span class="progress-text" id="quizProgressText" style="color: #8b5cf6;">📝 0/15</span>
      </div>
    </div>
  </header>

  <div class="body-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">📚 課程章節</div>
        <div class="sidebar-subtitle">5 門課程 ｜ 點擊切換</div>
      </div>
      <div class="chapter-list" id="chapterList"></div>
      <div class="sidebar-footer">
        <button class="reset-btn" id="resetBtn"
                title="清除所有學習進度與測驗答題,從頭開始">🔄 重置學習進度</button>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="content-inner" id="contentInner">
        <!-- chapter content rendered by JS -->
      </div>
    </main>
  </div>

// ============ State ============
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { current: 0, completed: [], quizAnswers: {} };
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}
let state = loadState();
if (!state.quizAnswers) state.quizAnswers = {};

// ============ Renderers ============
function renderSidebar() {
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  CHAPTERS.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'chapter-item' + (idx === state.current ? ' active' : '');
    item.dataset.idx = idx;

    const thumbUrl = `https://img.youtube.com/vi/${ch.videoId}/mqdefault.jpg`;

    const completed = state.completed.includes(idx);
    item.innerHTML = `
      <div class="chapter-thumb" style="background-image: url('${thumbUrl}')"></div>
      <div class="chapter-info">
        <div class="chapter-stage">
          <span class="stage-dot ${ch.stage}"></span>${ch.stageLabel}
        </div>
        <div class="chapter-title">${ch.title}</div>
        <div class="chapter-meta">
          <span>${ch.duration}</span>
          ${completed ? '<span class="chapter-checkmark">✓ 已完成</span>' : ''}
        </div>
      </div>
    `;
    item.addEventListener('click', () => {
      state.current = idx;
      saveState(state);
      renderSidebar();
      renderContent();
      // close sidebar on mobile
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
    list.appendChild(item);
  });
}

function renderQuiz(ch) {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  const chapterKey = String(ch.number);

  ch.quiz.forEach((q, qIdx) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';

    const answerKey = `${chapterKey}_${qIdx}`;
    const answered = state.quizAnswers[answerKey];

    let optionsHtml = '';
    q.options.forEach((opt, oIdx) => {
      let cls = 'quiz-option';
      let disabled = '';
      if (answered !== undefined) {
        disabled = 'disabled';
        if (oIdx === q.correct) {
          cls += answered.choice === oIdx ? ' correct' : ' reveal';
        } else if (answered.choice === oIdx) {
          cls += ' wrong';
        }
      }
      optionsHtml += `<button class="${cls}" ${disabled} data-q="${qIdx}" data-o="${oIdx}">${opt}</button>`;
    });

    let feedbackHtml = '';
    if (answered !== undefined) {
      feedbackHtml = `
        <div class="quiz-feedback show">
          <strong>${answered.choice === q.correct ? '✅ 答對了' : '❌ 答錯了 — 正確答案:' + q.options[q.correct]}</strong><br>
          ${q.explanation}
          <div class="biz-tip"><strong>💼 企業含意:</strong>${q.biz}</div>
        </div>
        <button class="quiz-retry show" data-q="${qIdx}">🔄 重新作答</button>
      `;
    } else {
      feedbackHtml = `<div class="quiz-feedback"></div><button class="quiz-retry" data-q="${qIdx}">🔄 重新作答</button>`;
    }

    card.innerHTML = `
      <span class="quiz-level-badge quiz-level-${q.level}">Lv.${qIdx + 1} ${q.level}</span>
      <div class="quiz-question">${q.question}</div>
      <div class="quiz-options">${optionsHtml}</div>
      ${feedbackHtml}
    `;

    container.appendChild(card);
  });

  // Bind option clicks
  container.querySelectorAll('.quiz-option:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', function() {
      const qIdx = parseInt(this.dataset.q);
      const oIdx = parseInt(this.dataset.o);
      const aKey = `${chapterKey}_${qIdx}`;
      state.quizAnswers[aKey] = { choice: oIdx };
      saveState(state);
      renderQuiz(ch);
      renderProgress();
    });
  });

  // Bind retry buttons
  container.querySelectorAll('.quiz-retry.show').forEach(btn => {
    btn.addEventListener('click', function() {
      const qIdx = parseInt(this.dataset.q);
      const aKey = `${chapterKey}_${qIdx}`;
      delete state.quizAnswers[aKey];
      saveState(state);
      renderQuiz(ch);
      renderProgress();
    });
  });
}

function renderProgress() {
  const total = CHAPTERS.length;
  const done = state.completed.length;
  const pct = (done / total) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done}/${total} 已完成`;

  // Quiz progress: count correct answers
  let correct = 0;
  let totalQ = 0;
  CHAPTERS.forEach(ch => {
    ch.quiz.forEach((q, qIdx) => {
      totalQ += 1;
      const aKey = `${ch.number}_${qIdx}`;
      const ans = state.quizAnswers[aKey];
      if (ans && ans.choice === q.correct) correct += 1;
    });
  });
  document.getElementById('quizProgressText').textContent = `📝 ${correct}/${totalQ}`;
}

// ============ Mobile sidebar toggle ============
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

// ============ Reset progress ============
document.getElementById('resetBtn').addEventListener('click', function() {
  if (confirm('確定要重置所有學習進度嗎?\n\n這會清除:\n• 章節完成記錄\n• 所有測驗答題\n• 章節停留位置\n\n重置後將回到第 1 課從頭開始。')) {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.reload();
  }
});

// ============ Init ============
renderSidebar();
renderContent();
renderProgress();
</script>
