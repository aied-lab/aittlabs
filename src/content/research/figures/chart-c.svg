<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><rect width="760" height="300" fill="#fcfcfb"/><text x="20" y="24" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">圖 C｜算力建置與人才需求推估的年均複合成長率（CAGR）對比</text><text x="20" y="40" font-size="10" fill="#8d8c88" text-anchor="start" font-weight="400">以各項目公開數據之起訖值換算年均複合成長率，消除期間長度差異後比較</text><line x1="250.0" y1="52" x2="250.0" y2="250" stroke="#e8e8e5"/><text x="250.0" y="268" font-size="10" fill="#8d8c88" text-anchor="middle" font-weight="400">+0%</text><line x1="390.0" y1="52" x2="390.0" y2="250" stroke="#e8e8e5"/><text x="390.0" y="268" font-size="10" fill="#8d8c88" text-anchor="middle" font-weight="400">+50%</text><line x1="530.0" y1="52" x2="530.0" y2="250" stroke="#e8e8e5"/><text x="530.0" y="268" font-size="10" fill="#8d8c88" text-anchor="middle" font-weight="400">+100%</text><line x1="670.0" y1="52" x2="670.0" y2="250" stroke="#e8e8e5"/><text x="670.0" y="268" font-size="10" fill="#8d8c88" text-anchor="middle" font-weight="400">+150%</text><rect x="250" y="60" width="375.2" height="42" rx="4" fill="#2a78d6"/><rect x="250" y="60" width="4" height="42" fill="#2a78d6"/><text x="635.2" y="86.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">+134%</text><text x="238" y="85.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">公共算力（16→480 PF，2025→2029）</text><rect x="250" y="120" width="184.8" height="42" rx="4" fill="#2a78d6"/><rect x="250" y="120" width="4" height="42" fill="#2a78d6"/><text x="444.8" y="146.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">+66%</text><text x="238" y="145.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">AI 資料中心用電（60→450 MW，2025→2029）</text><rect x="250" y="180" width="25.2" height="42" rx="4" fill="#eb6834"/><rect x="250" y="180" width="4" height="42" fill="#eb6834"/><text x="285.2" y="206.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="700">+9%</text><text x="238" y="205.0" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">官方 AI 人才年需求推估（3,520→4,170 人，2025→2027）</text><line x1="250" y1="52" x2="250" y2="250" stroke="#52514e"/><text x="20" y="292" font-size="10" fill="#8d8c88" text-anchor="start" font-weight="400">註：三者量綱與涵蓋範圍不同，僅供成長量級對比；反映的是基礎設施與人才養成的時間尺度差異。</text></svg>