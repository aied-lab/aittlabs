name: Update Substack Cache

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 (台灣早上 7:30)，在 deploy 前跑
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Substack posts
        run: |
          mkdir -p .cache
          node -e "
            fetch('https://aiedlab.substack.com/api/v1/posts?limit=15')
              .then(r => r.json())
              .then(posts => {
                const data = posts.map(p => ({
                  title: p.title,
                  link: p.canonical_url,
                  date: p.post_date,
                  summary: (p.subtitle || p.description || '').slice(0, 120),
                  image: p.cover_image || null,
                }));
                require('fs').writeFileSync('.cache/substack.json', JSON.stringify(data, null, 2));
                console.log('Saved', data.length, 'posts');
              })
              .catch(() => {
                // Fallback: use rss2json
                fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Faiedlab.substack.com%2Ffeed')
                  .then(r => r.json())
                  .then(d => {
                    if (d.status === 'ok') {
                      const data = d.items.map(item => ({
                        title: item.title,
                        link: item.link,
                        date: item.pubDate,
                        summary: (item.description || '').replace(/<[^>]*>/g, '').replace(/&#[0-9]+;/g, '').replace(/&[^;]+;/g, '').slice(0, 120),
                        image: item.thumbnail || item.enclosure?.link || null,
                      }));
                      require('fs').writeFileSync('.cache/substack.json', JSON.stringify(data, null, 2));
                      console.log('Saved (via rss2json)', data.length, 'posts');
                    }
                  });
              });
          "
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cache/substack.json
          git diff --cached --quiet || git commit -m "chore: update Substack cache" && git push || true
