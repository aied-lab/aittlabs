name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 機器人用 GITHUB_TOKEN 推的 Substack 快取 commit 不會觸發 push 事件，
  # 因此改用 workflow_run：等「Update Substack Cache」跑完就自動接著部署。
  workflow_run:
    workflows: ["Update Substack Cache"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
