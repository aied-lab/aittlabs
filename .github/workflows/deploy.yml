name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (台灣時間早上 8:00) 自動重建
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-fetch RSS feeds
        run: |
          mkdir -p .cache
          curl -sL -A "Mozilla/5.0" -o .cache/substack.xml "https://aiedlab.substack.com/feed" || true
          curl -sL -A "Mozilla/5.0" -o .cache/cio.xml "https://www.cio.com.tw/author/author2/feed/" || true
          echo "Substack RSS size: $(wc -c < .cache/substack.xml) bytes"
          echo "CIO RSS size: $(wc -c < .cache/cio.xml) bytes"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
